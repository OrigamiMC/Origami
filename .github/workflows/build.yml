name: Build

on:
  workflow_dispatch:
  push:
  pull_request:
    types:
      - opened
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '25'

      - name: Modify gradlew permissions
        run: chmod +x ./gradlew

#      - name: Run tests
#        run: ./gradlew test

      - name: Build API
        run: ./gradlew :origami-api:jar

      - name: Set up strata
        run: ./gradlew :origami-server:setupStrata

      - name: Apply file patches
        run: ./gradlew :origami-server:applyFilePatches

      - name: Apply feature patches
        run: ./gradlew :origami-server:applyFeaturePatches

      - name: Build server jar
        run: ./gradlew :origami-server:jar

      - name: Build server bundle
        run: ./gradlew :origami-server:shadowJar

      - name: Create server jar patch
        run: ./gradlew :origami-server:createServerJarPatch